  <rect x="25" y="25" width="135" height="28" rx="14" fill="rgba(0, 229, 255, 0.25)" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="92" y="43" font-family="sans-serif" font-size="11" font-weight="700" fill="#00e5ff" text-anchor="middle">⭐ KIDS UNISEX</text>
