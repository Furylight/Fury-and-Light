<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#090d14"/>
  <circle cx="250" cy="275" r="215" fill="url(#glow)"/>
  
  <!-- Baggy T-Shirt Body (Ice Blue) -->
  <g class="tshirt-wrap">
    <path d="M 165 85 Q 250 120 335 85 L 455 165 L 415 245 L 365 215 L 370 470 Q 250 480 130 470 L 135 215 L 85 245 L 45 165 Z" fill="#00e5ff" stroke="#0284c7" stroke-width="2.5"/>
    <path d="M 165 85 Q 250 120 335 85 L 455 165 L 415 245 L 365 215 L 370 470 Q 250 480 130 470 L 135 215 L 85 245 L 45 165 Z" fill="url(#shade)"/>
    <path d="M 170 85 Q 250 122 330 85 Q 250 100 170 85 Z" fill="#00c8e0" stroke="#0284c7" stroke-width="1.8"/>
  </g>

  <!-- Graphic Print -->
  <g transform="translate(165, 155) scale(0.35)">
    <path d="M 120 70 C 60 10 0 65 25 125 C 45 185 120 235 120 235 C 120 235 195 185 215 125 C 240 65 180 10 120 70 Z" 
          fill="#0a0f1d" stroke="#090d14" stroke-width="8"/>
    <circle cx="90" cy="100" r="7" fill="#ffffff" filter="url(#neon)"/>
    <circle cx="150" cy="100" r="7" fill="#00e5ff" filter="url(#neon)"/>
    <path d="M 35 85 Q 5 50 25 20 Q 55 50 65 85" fill="none" stroke="#090d14" stroke-width="5"/>
    <path d="M 205 85 Q 235 50 215 20 Q 185 50 175 85" fill="none" stroke="#090d14" stroke-width="5"/>
  </g>

  <!-- Typography -->
  <text x="250" y="275" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#08101a" letter-spacing="4" text-anchor="middle">CYBER DRAGON</text>
  <text x="250" y="298" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#0b1b2d" letter-spacing="2.5" text-anchor="middle">OVERSIZED STREETWEAR</text>
  <rect x="200" y="310" width="100" height="2" fill="#08101a" opacity="0.8"/>

  <!-- Badge Tag -->
  <rect x="25" y="25" width="125" height="28" rx="14" fill="rgba(0, 229, 255, 0.25)" stroke="#00e5ff" stroke-width="1.2"/>
  <text x="87" y="43" font-family="sans-serif" font-size="11" font-weight="700" fill="#00e5ff" text-anchor="middle">🔥 BAGGY FIT</text>
</svg>