<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="fabricShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="#0c1017"/>
  <circle cx="250" cy="270" r="220" fill="url(#bgGlow)"/>
  
  <!-- Baggy / Oversized T-Shirt Silhouette -->
  <g class="tshirt-body" id="shirt">
    <!-- Dropshoulder sleeves and boxy fit -->
    <path d="M 170 85 Q 250 120 330 85 L 450 160 L 410 240 L 360 210 L 365 470 Q 250 480 135 470 L 140 210 L 90 240 L 50 160 Z" 
          fill="#111318" stroke="#1f2937" stroke-width="2"/>
    <!-- Fabric Shading Overlay -->
    <path d="M 170 85 Q 250 120 330 85 L 450 160 L 410 240 L 360 210 L 365 470 Q 250 480 135 470 L 140 210 L 90 240 L 50 160 Z" 
          fill="url(#fabricShade)"/>
    <!-- Collar -->
    <path d="M 170 85 Q 250 125 330 85 Q 250 100 170 85 Z" fill="#0d0e12" stroke="#2a3342" stroke-width="1.5"/>
    <!-- Shoulder drop seams -->
    <line x1="170" y1="85" x2="140" y2="210" stroke="#1f2937" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="330" y1="85" x2="360" y2="210" stroke="#1f2937" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Graphic Print: Dragon Heart Graphic & Typography -->
  <g transform="translate(160, 160) scale(0.36)">
    <!-- Dragon Graphic Silhouette -->
    <path d="M 125 80 C 70 20 10 70 30 130 C 50 190 125 240 125 240 C 125 240 200 190 220 130 C 240 70 180 20 125 80 Z" 
          fill="none" stroke="#00e5ff" stroke-width="8" filter="url(#iceGlow)"/>
    <circle cx="95" cy="110" r="6" fill="#00e5ff" filter="url(#iceGlow)"/>
    <circle cx="155" cy="110" r="6" fill="#ffffff" filter="url(#iceGlow)"/>
    <!-- Dragon wings / horns hint -->
    <path d="M 40 90 Q 10 60 30 30 Q 60 60 70 90" fill="none" stroke="#00e5ff" stroke-width="4"/>
    <path d="M 210 90 Q 240 60 220 30 Q 190 60 180 90" fill="none" stroke="#ffffff" stroke-width="4"/>
  </g>
  
  <!-- Streetwear Typography -->
  <text x="250" y="280" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">FURY &amp; LIGHT</text>
  <text x="250" y="302" font-family="'Courier New', monospace" font-size="10" fill="#00e5ff" letter-spacing="3" text-anchor="middle">OVERSIZED EDITION // 240 GSM</text>
  <rect x="210" y="315" width="80" height="2" fill="#00e5ff" opacity="0.7"/>

  <!-- Badge Tag -->
  <rect x="25" y="25" width="110" height="28" rx="14" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="1"/>
  <text x="80" y="43" font-family="sans-serif" font-size="11" font-weight="700" fill="#00e5ff" text-anchor="middle">🔥 BAGGY FIT</text>
</svg>
